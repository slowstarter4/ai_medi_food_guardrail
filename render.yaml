services:
  # Backend: FastAPI Web Service
  - type: web
    name: safeeat-backend
    runtime: python
    region: singapore # 가까운 리전 선택
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: OPENAI_API_KEY
        sync: false # Render 대시보드에서 수동 입력 권장
      - key: DATA_GO_KR_API_KEY
        sync: false
      - key: CLOVA_OCR_API_URL
        sync: false
      - key: CLOVA_OCR_SECRET_KEY
        sync: false

  # Frontend: React Static Site
  - type: static
    name: safeeat-frontend
    runtime: node
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: safeeat-backend
          property: host
    routingRules:
      - route: /*
        destination: /index.html
